<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
     <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script src="shared.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-400 via-purple-700 to-blue-400">

    <button id="darkModeBtn" class="fixed top-4 left-4 border rounded px-3 py-1 bg-white dark:bg-gray-800 text-lg"></button>

    <div class="flex w-11/12 max-w-4xl h-[650px] bg-white dark:bg-gray-800 text-black dark:text-white rounded-2xl overflow-hidden shadow-2xl">

        <div class="flex-1 bg-purple-800 flex flex-col items-center justify-center p-8">
            <img src="lock.png" alt="Lock icon" class="w-24 h-24 mb-4">
            <h1 class="text-3xl font-bold text-white">Welcome Page</h1>
        </div>

        <div class="flex-1 p-10">

            <h1 class="text-3xl font-bold mb-4">Login</h1>

            <form id="loginForm">

                <label for="username" class="block mb-1">Email:</label>
                <input type="email" id="username" required class="border rounded w-full p-2 mb-4 text-black">

                <label for="password" class="block mb-1">Password:</label>
                <div class="relative mb-4">
                    <input type="password" id="password" required class="border rounded w-full p-2 pr-10 text-black">
                    <button type="button" id="togglePassword" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>

                <label for="captcha" class="block mb-1">What is <span id="captchaQuestion"></span>?</label>
                <input type="number" id="captcha" required class="border rounded w-full p-2 mb-4 text-black">

                <button type="submit" class="w-full bg-purple-800 text-white font-semibold rounded p-3">Login</button>

            </form>

            <a href="forgot_password.html" class="block mt-4">Forgot Password?</a>

            <button type="button" onclick="window.location.href='signup.html'" class="border rounded w-full p-2 mt-4"> Create Account</button>
        </div>

    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");

        var darkModeBtn = document.getElementById("darkModeBtn");

        var darkModeOn = localStorage.getItem("darkMode") === "true";

        if (darkModeOn) {
            document.documentElement.classList.add("dark");
            darkModeBtn.textContent = "☀️";
        } else {
            darkModeBtn.textContent = "🌙";
        }

        darkModeBtn.onclick = function() {
            document.documentElement.classList.toggle("dark");

            darkModeOn = document.documentElement.classList.contains("dark");
            localStorage.setItem("darkMode", darkModeOn);

            if (darkModeOn) {
                darkModeBtn.textContent = "☀️";
            } else {
                darkModeBtn.textContent = "🌙";
            }
        };

        var captchaNum1 = 0;
        var captchaNum2 = 0;

        function makeCaptcha() {
            captchaNum1 = Math.floor(Math.random() * 10);
            captchaNum2 = Math.floor(Math.random() * 10);
            document.getElementById("captchaQuestion").textContent = captchaNum1 + " + " + captchaNum2;
            document.getElementById("captcha").value = "";
        }

        makeCaptcha();

        toggleButton.addEventListener("click", function() {
                var eyeIcon = document.getElementById("eyeIcon");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    eyeIcon.innerHTML = "<path d='M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12A3 3 0 1 1 9.88 9.88'/><line x1='1' y1='1' x2='23' y2='23'/>";
                } else {
                    passwordInput.type = "password";
                    eyeIcon.innerHTML = "<path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/>";
                }
            });

        function getUsers() {
            var usersText = localStorage.getItem("users");

            if (usersText === null) {
                return [];
            }

            return JSON.parse(usersText);
        }

        loginForm.addEventListener("submit", function(e) {
            e.preventDefault();

            var captchaAnswer = parseInt(document.getElementById("captcha").value, 10);

            if (captchaAnswer !== captchaNum1 + captchaNum2) {
                showNotification("captcha answer is incorrect", true);
                makeCaptcha();
                return;
            }

            const enteredUsername = document.getElementById("username").value.trim();
            const enteredPassword = passwordInput.value;

            var users = getUsers();

            if (users.length === 0) {
                showNotification("create an account first", true);
                return;
            }

            var matchedUser = null;

            for (var i = 0; i < users.length; i++) {
                if (users[i].username === enteredUsername) {
                    matchedUser = users[i];
                }
            }

            if (matchedUser === null) {
                showNotification("incorrect username/password.", true);
                return;
            }

            const isPasswordMatch = dcodeIO.bcrypt.compareSync(enteredPassword, matchedUser.password);

            if (!isPasswordMatch) {
                showNotification("incorrect username/password.", true);
                return;
            }

            if (!window.showOpenFilePicker) {
                showNotification("your browser does not support file access. use Chrome or Edge.", true);
                return;
            }

            window.showOpenFilePicker({
                types: [{
                    description: "JSON data file",
                    accept: { "application/json": [".json"] }
                }],
                multiple: false
            }).then(function(handles) {

                var handle = handles[0];

                return saveFileHandle(handle).then(function() {

                    sessionStorage.setItem("loggedIn", "true");
                    sessionStorage.setItem("currentUser", matchedUser.username);

                    showNotification("login successful", false);

                    setTimeout(function() {
                        window.location.href = "lists.html";
                    }, 1000);

                });

            }).catch(function(err) {
                showNotification("you must pick a data file to log in", true);
            });
        });
    </script>

</body>
</html>
