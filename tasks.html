<!DOCTYPE html>
<html>
<head>
    <title>My Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="shared.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" id="flatpickrDark" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css" disabled>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-black dark:text-white min-h-screen p-8 flex flex-col">

    <header class="flex justify-between items-center mb-6">
        <button id="darkModeBtn" class="rounded px-3 py-1 bg-white dark:bg-gray-800 text-lg"></button>
        <div class="flex items-center gap-3">
            <button id="avatarBtn" title="Click to change avatar"></button>
            <div class="relative">
                <button id="userMenuBtn" class="flex items-center gap-1 rounded px-3 py-1 bg-white dark:bg-gray-800">
                    <span id="usernameSpan"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <div id="userMenuDropdown" class="hidden absolute right-0 mt-1 w-32 bg-white dark:bg-gray-700 rounded shadow z-10">
                    <button id="profileMenuItem" class="block w-full text-left p-2 hover:bg-gray-100 dark:hover:bg-gray-600">Profile</button>
                    <button id="signOutMenuItem" class="block w-full text-left p-2 hover:bg-gray-100 dark:hover:bg-gray-600">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    <div class="flex items-center gap-3 mb-6">
        <h1 id="listTitle" class="text-3xl font-bold"></h1>
        <button id="editListBtn" title="Edit" class="bg-blue-500 text-white p-2 rounded"></button>
    </div>

    <div class="flex gap-2 mb-6">
        <input type="text" id="taskInput" class="rounded p-2 flex-1 text-black dark:text-white bg-white dark:bg-gray-800">
        <button id="addTaskBtn" class="bg-purple-800 text-white px-4 py-2 rounded">Add Task</button>
    </div>

    <div class="flex gap-2 mb-4">
        <input type="text" id="searchInput" placeholder="Search tasks" class="rounded p-2 flex-1 text-black dark:text-white bg-white dark:bg-gray-800" onkeyup="renderTasks()">
        <select id="sortInput" class="rounded p-2 text-black dark:text-white bg-white dark:bg-gray-800" onchange="renderTasks()">
            <option value="default">Default</option>
            <option value="date">Date (Closest)</option>
            <option value="grouped">Date (Grouped)</option>
            <option value="name">Name (A-Z)</option>
        </select>
        <button id="clearBtn" class="rounded px-4 bg-gray-500 text-white">Clear</button>
    </div>

    <p id="emptyMessage" class="text-gray-500 dark:text-gray-400 hidden"></p>

    <div id="taskListsContainer">

        <div id="defaultView">
            <h2 id="pendingHeading" class="text-xl font-bold mb-2">Pending</h2>
            <ul id="pendingList"></ul>
            <h2 id="completedHeading" class="text-xl font-bold mb-2 mt-6">Completed</h2>
            <ul id="completedList"></ul>
        </div>

        <div id="dateView">
            <div id="pastSection">
                <h2 class="text-xl font-bold mb-2">Past</h2>
                <ul id="pastList"></ul>
            </div>
            <div id="todaySection">
                <h2 class="text-xl font-bold mb-2">Today</h2>
                <ul id="todayList"></ul>
            </div>
            <div id="upcomingSection">
                <h2 class="text-xl font-bold mb-2">Upcoming</h2>
                <ul id="upcomingList"></ul>
            </div>
            <div id="noDateSection">
                <h2 class="text-xl font-bold mb-2 mt-6">No Date</h2>
                <ul id="noDateList"></ul>
            </div>
        </div>

    </div>

    <input type="text" id="hiddenDateInput" class="hidden">

    <footer class="text-center text-gray-500 dark:text-gray-400 mt-auto pt-8">Footer</footer>

<script>

if (sessionStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
else {

setupHeader();

var urlParams = new URLSearchParams(window.location.search);
var listId = urlParams.get("list");

var listTitle = document.getElementById("listTitle");
var editListBtn = document.getElementById("editListBtn");
var taskInput = document.getElementById("taskInput");
var addTaskBtn = document.getElementById("addTaskBtn");
var pendingList = document.getElementById("pendingList");
var completedList = document.getElementById("completedList");
var pendingHeading = document.getElementById("pendingHeading");
var completedHeading = document.getElementById("completedHeading");
var emptyMessage = document.getElementById("emptyMessage");
var hiddenDateInput = document.getElementById("hiddenDateInput");
var clearBtn = document.getElementById("clearBtn");
var defaultView = document.getElementById("defaultView");
var dateView = document.getElementById("dateView");
var taskListsContainer = document.getElementById("taskListsContainer");

var fileHandle = null;
var data = null;
var currentList = null;

function saveData() {
    writeDataToFile(fileHandle, data);
}

var editIconSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7'/><path d='M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z'/></svg>";
var deleteIconSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><line x1='18' y1='6' x2='6' y2='18'/><line x1='6' y1='6' x2='18' y2='18'/></svg>";
var calendarIconSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>";
var checkIconSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><polyline points='20 6 9 17 4 12'/></svg>";
var dotsIconSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='currentColor'><circle cx='12' cy='5' r='2'/><circle cx='12' cy='12' r='2'/><circle cx='12' cy='19' r='2'/></svg>";

editListBtn.innerHTML = editIconSvg;

function startListEdit() {

    listTitle.innerHTML = "";

    var input = document.createElement("input");
    input.type = "text";
    input.value = currentList.name;
    input.className = "rounded p-1 text-black dark:text-white bg-white dark:bg-gray-700 text-3xl font-bold w-64 mr-2";

    var saveBtn = document.createElement("button");
    saveBtn.className = "bg-green-500 text-white p-2 rounded mr-2";
    saveBtn.innerHTML = checkIconSvg;
    saveBtn.onclick = function() {
        saveListEdit(input.value);
    };

    var cancelBtn = document.createElement("button");
    cancelBtn.className = "bg-gray-500 text-white p-2 rounded";
    cancelBtn.innerHTML = deleteIconSvg;
    cancelBtn.onclick = function() {
        listTitle.innerHTML = currentList.name;
    };

    listTitle.appendChild(input);
    listTitle.appendChild(saveBtn);
    listTitle.appendChild(cancelBtn);
    input.focus();

    input.addEventListener("keydown", function(e) {
        if (e.key == "Enter") {
            saveListEdit(input.value);
        }
        if (e.key == "Escape") {
            listTitle.innerHTML = currentList.name;
        }
    });
}

function saveListEdit(newName) {
    currentList.rename(newName);
    saveData();
    listTitle.innerHTML = currentList.name;
}

editListBtn.onclick = function() {
    startListEdit();
};

function generateId(existingIds) {
    var newId = Math.floor(Math.random() * 1000000000).toString();
    while (existingIds[newId] != null) {
        newId = Math.floor(Math.random() * 1000000000).toString();
    }
    return newId;
}

function formatDate(dateString) {
    var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var parts = dateString.split("-");
    var year = parts[0];
    var month = parts[1];
    var day = parts[2];
    var monthIndex = parseInt(month, 10) - 1;
    var monthName = monthNames[monthIndex];
    var dayNumber = parseInt(day, 10);
    return monthName + " " + dayNumber + ", " + year;
}

function getTodayString() {
    var now = new Date();
    var year = now.getFullYear();
    var month = now.getMonth() + 1;
    var day = now.getDate();
    if (month < 10) { month = "0" + month; }
    if (day < 10) { day = "0" + day; }
    return year + "-" + month + "-" + day;
}

function getDateCategory(task) {
    return task.getDateCategory(getTodayString());
}

var taskIdBeingEdited = null;
var menuOpenForTaskId = null;

function buildMenuHtml(taskId) {
    var menuHtml = "<div class='relative'>";
    menuHtml += "<button title='Options' data-action='menu-toggle' class='bg-gray-200 dark:bg-gray-700 text-black dark:text-white p-2 rounded'>" + dotsIconSvg + "</button>";
    if (menuOpenForTaskId == taskId) {
        menuHtml += "<div class='absolute right-0 mt-1 w-40 bg-white dark:bg-gray-700 rounded shadow z-10'>";
        menuHtml += "<button data-action='set-date' class='flex items-center gap-2 w-full text-left p-2 hover:bg-gray-100 dark:hover:bg-gray-600'><span class='text-yellow-500'>" + calendarIconSvg + "</span> Set Date</button>";
        menuHtml += "<button data-action='edit' class='flex items-center gap-2 w-full text-left p-2 hover:bg-gray-100 dark:hover:bg-gray-600'><span class='text-blue-500'>" + editIconSvg + "</span> Edit</button>";
        menuHtml += "<button data-action='delete' class='flex items-center gap-2 w-full text-left p-2 hover:bg-gray-100 dark:hover:bg-gray-600'><span class='text-red-500'>" + deleteIconSvg + "</span> Delete</button>";
        menuHtml += "</div>";
    }
    menuHtml += "</div>";
    return menuHtml;
}

function toggleMenu(taskId) {
    if (menuOpenForTaskId == taskId) {
        menuOpenForTaskId = null;
    } else {
        menuOpenForTaskId = taskId;
    }
    renderTasks();
}

document.addEventListener("click", function() {
    if (menuOpenForTaskId != null) {
        menuOpenForTaskId = null;
        renderTasks();
    }
});

function buildTaskHtml(taskId, task, cardClass) {
    var dateText = "";
    if (task.date) {
        dateText = " <span class='text-xs text-gray-500 dark:text-gray-400'>(" + formatDate(task.date) + ")</span>";
    }
    var menuHtml = buildMenuHtml(taskId);
    var checkedAttr = task.IsCompleted ? " checked" : "";
    var nameHtml = task.IsCompleted ? "<del>" + task.name + "</del>" : task.name;
    return "<li class='" + cardClass + "' data-task-id='" + taskId + "'><span><input type='checkbox' data-action='toggle'" + checkedAttr + "> <span class='cursor-pointer' data-action='edit-name'>" + nameHtml + "</span>" + dateText + "</span>" + menuHtml + "</li>";
}

function buildEditHtml(taskId, task) {
    var editRowHtml = "<li class='bg-white dark:bg-gray-800 rounded shadow p-4 mb-2 flex items-center gap-2' data-task-id='" + taskId + "'>";
    editRowHtml += "<input type='text' id='editInput_" + taskId + "' value=\"" + task.name + "\" data-action='edit-input' class='rounded p-1 w-64 text-black dark:text-white bg-white dark:bg-gray-700'>";
    editRowHtml += "<button title='Save' data-action='save' class='bg-green-500 text-white p-2 rounded'>" + checkIconSvg + "</button>";
    editRowHtml += "<button title='Cancel' data-action='cancel' class='bg-gray-500 text-white p-2 rounded'>" + deleteIconSvg + "</button>";
    editRowHtml += "</li>";
    return editRowHtml;
}

function renderTasks() {

    var search = document.getElementById("searchInput").value.toLowerCase();
    var sort = document.getElementById("sortInput").value;
    var cardClass = "bg-white dark:bg-gray-800 rounded shadow p-4 mb-2 flex items-center justify-between";

    var taskArray = Object.keys(currentList.tasks).map(function(taskId) {
        return {
            id: taskId,
            task: currentList.tasks[taskId]
        };
    }).filter(function(item) {
        return item.task.name.toLowerCase().includes(search);
    });

    if (sort == "name") {
        taskArray.sort(function(a, b) {
            return a.task.name.localeCompare(b.task.name);
        });
    }

    if (sort == "date" || sort == "grouped") {
        taskArray.sort(function(a, b) {
            if (a.task.date == "") { return 1; }
            if (b.task.date == "") { return -1; }
            return new Date(a.task.date) - new Date(b.task.date);
        });
    }

    var totalCount = taskArray.length;

    if (sort == "default" || sort == "name") {

        defaultView.classList.remove("hidden");
        dateView.classList.add("hidden");

        var pendingHtml = "";
        var completedHtml = "";
        var pendingCount = 0;
        var completedCount = 0;

        taskArray.forEach(function(item) {
            var taskId = item.id;
            var task = item.task;

            if (taskId == taskIdBeingEdited) {
                var editHtml = buildEditHtml(taskId, task);
                if (task.IsCompleted == false) {
                    pendingHtml += editHtml;
                    pendingCount++;
                } else {
                    completedHtml += editHtml;
                    completedCount++;
                }
                return;
            }

            if (task.IsCompleted == false) {
                pendingHtml += buildTaskHtml(taskId, task, cardClass);
                pendingCount++;
            } else {
                completedHtml += buildTaskHtml(taskId, task, cardClass);
                completedCount++;
            }
        });

        pendingList.innerHTML = pendingHtml;
        completedList.innerHTML = completedHtml;

        if (pendingCount > 0) {
            pendingHeading.classList.remove("hidden");
        } else {
            pendingHeading.classList.add("hidden");
        }

        if (completedCount > 0) {
            completedHeading.classList.remove("hidden");
        } else {
            completedHeading.classList.add("hidden");
        }

    } else {

        defaultView.classList.add("hidden");
        dateView.classList.remove("hidden");

        var pastHtml = "";
        var todayHtml = "";
        var upcomingHtml = "";
        var noDateHtml = "";
        var pastCount = 0;
        var todayCount = 0;
        var upcomingCount = 0;
        var noDateCount = 0;

        taskArray.forEach(function(item) {
            var taskId = item.id;
            var task = item.task;
            var category = getDateCategory(task);

            var rowHtml = "";

            if (taskId == taskIdBeingEdited) {
                rowHtml = buildEditHtml(taskId, task);
            } else {
                rowHtml = buildTaskHtml(taskId, task, cardClass);
            }

            if (category == "past") {
                pastHtml += rowHtml;
                pastCount++;
            } else if (category == "today") {
                todayHtml += rowHtml;
                todayCount++;
            } else if (category == "upcoming") {
                upcomingHtml += rowHtml;
                upcomingCount++;
            } else {
                noDateHtml += rowHtml;
                noDateCount++;
            }
        });

        document.getElementById("pastList").innerHTML = pastHtml;
        document.getElementById("todayList").innerHTML = todayHtml;
        document.getElementById("upcomingList").innerHTML = upcomingHtml;
        document.getElementById("noDateList").innerHTML = noDateHtml;

        if (pastCount > 0) {
            document.getElementById("pastSection").classList.remove("hidden");
        } else {
            document.getElementById("pastSection").classList.add("hidden");
        }

        if (todayCount > 0) {
            document.getElementById("todaySection").classList.remove("hidden");
        } else {
            document.getElementById("todaySection").classList.add("hidden");
        }

        if (upcomingCount > 0) {
            document.getElementById("upcomingSection").classList.remove("hidden");
        } else {
            document.getElementById("upcomingSection").classList.add("hidden");
        }

        if (noDateCount > 0) {
            document.getElementById("noDateSection").classList.remove("hidden");
        } else {
            document.getElementById("noDateSection").classList.add("hidden");
        }

    }

    if (totalCount == 0) {
        var totalTasks = Object.keys(currentList.tasks).length;
        if (totalTasks == 0) {
            emptyMessage.textContent = "No tasks have been added yet";
        } else {
            emptyMessage.textContent = "No tasks found";
        }
        emptyMessage.classList.remove("hidden");
    } else {
        emptyMessage.classList.add("hidden");
    }

    if (taskIdBeingEdited != null) {
        var input = document.getElementById("editInput_" + taskIdBeingEdited);
        if (input != null) {
            input.focus();
        }
    }

}

taskListsContainer.addEventListener("click", function(e) {

    var actionElement = e.target.closest("[data-action]");
    if (actionElement == null) {
        return;
    }

    var action = actionElement.dataset.action;
    var row = actionElement.closest("[data-task-id]");
    var taskId = row != null ? row.dataset.taskId : null;

    if (action == "menu-toggle") {
        e.stopPropagation();
        toggleMenu(taskId);
        return;
    }
    if (action == "toggle") {
        toggleTask(taskId);
        return;
    }
    if (action == "edit-name" || action == "edit") {
        startTaskEdit(taskId);
        return;
    }
    if (action == "set-date") {
        setTaskDate(taskId, actionElement);
        return;
    }
    if (action == "delete") {
        deleteTask(taskId);
        return;
    }
    if (action == "save") {
        saveTaskEdit(taskId);
        return;
    }
    if (action == "cancel") {
        cancelTaskEdit();
        return;
    }
});

taskListsContainer.addEventListener("keydown", function(e) {
    if (e.key == "Enter") {
        var input = e.target.closest("[data-action='edit-input']");
        if (input != null) {
            var row = input.closest("[data-task-id]");
            if (row != null) {
                saveTaskEdit(row.dataset.taskId);
            }
        }
    }
});

clearBtn.onclick = function() {
    document.getElementById("searchInput").value = "";
    document.getElementById("sortInput").value = "default";
    renderTasks();
};

function startTaskEdit(taskId) {
    menuOpenForTaskId = null;
    taskIdBeingEdited = taskId;
    renderTasks();
}

function cancelTaskEdit() {
    taskIdBeingEdited = null;
    renderTasks();
}

function saveTaskEdit(taskId) {
    var input = document.getElementById("editInput_" + taskId);
    currentList.tasks[taskId].rename(input.value);
    taskIdBeingEdited = null;
    saveData();
    renderTasks();
}

addTaskBtn.onclick = function() {
    var text = taskInput.value;
    if (text == "") {
        return;
    }
    var newTaskId = generateId(currentList.tasks);
    currentList.addTask(newTaskId, new Task(text));
    saveData();
    taskInput.value = "";
    renderTasks();
};

taskInput.addEventListener("keydown", function(e) {
    if (e.key == "Enter") {
        addTaskBtn.click();
    }
});

function toggleTask(taskId) {
    currentList.tasks[taskId].toggle();
    saveData();
    renderTasks();
}

var taskIdBeingDated = null;

var datePicker = flatpickr("#hiddenDateInput", {
    dateFormat: "Y-m-d",
    onChange: function(selectedDates, dateStr) {
        if (taskIdBeingDated != null) {
            currentList.tasks[taskIdBeingDated].setDate(dateStr);
            saveData();
            renderTasks();
            taskIdBeingDated = null;
        }
    }
});

function setTaskDate(taskId, buttonElement) {
    menuOpenForTaskId = null;
    taskIdBeingDated = taskId;
    datePicker.set("positionElement", buttonElement);
    datePicker.setDate(currentList.tasks[taskId].date || null);
    datePicker.open();
}

function deleteTask(taskId) {
    menuOpenForTaskId = null;
    currentList.deleteTask(taskId);
    saveData();
    renderTasks();
}

async function startPage() {
    try {
        var handle = await loadFileHandle();
        if (handle == null) {
            showNotification("please log in and pick your data file", true);
            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
            return;
        }
        fileHandle = handle;
        data = await readDataFromFile(fileHandle);
        if (data.lists == null) {
            data.lists = {};
        }
        currentList = data.lists[listId];
        listTitle.innerHTML = currentList.name;
        renderTasks();
    } catch (err) {
        showNotification("could not read the data file", true);
    }
}

startPage();

}

</script>
</body>
</html>
