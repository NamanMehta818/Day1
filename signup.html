<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-400 via-purple-700 to-blue-400">

    <div id="notification" class="hidden fixed top-4 right-4 px-4 py-2 rounded shadow text-white"></div>

    <div class="flex w-11/12 max-w-4xl h-[650px] bg-white rounded-2xl overflow-hidden shadow-2xl">

        <div class="flex-1 bg-purple-800 flex items-center justify-center p-8">
            <h1 class="text-3xl font-bold text-white">Welcome Page</h1>
        </div>

        <div class="flex-1 p-10">

            <h1 class="text-3xl font-bold mb-4">Create Account</h1>

            <form id="signupForm">

                <label for="username" class="block mb-1">Email:</label>
                <input type="email" id="username" required class="border rounded w-full p-2 mb-4">

                <label for="password" class="block mb-1">Password:</label>
                <div class="flex mb-1">
                    <input type="password" id="password" required class="border rounded w-full p-2">
                    <button type="button" id="togglePassword" class="border rounded px-3 ml-2">Show</button>
                </div>
                <p class="text-xs text-gray-500 mb-4">Must be 8+ characters, have 1 capital letter and 1 special character</p>

                <button type="submit" class="w-full bg-purple-800 text-white font-semibold rounded p-3">Create Account</button>

            </form>

            <button type="button" onclick="window.location.href='login.html'" class="border rounded w-full p-2 mt-4">
                Already have an account? Login
            </button>
        </div>

    </div>

    <script>
        const signupForm = document.getElementById("signupForm");
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");

        toggleButton.addEventListener("click", function() {
                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    toggleButton.textContent = "Hide";
                } else {
                    passwordInput.type = "password";
                    toggleButton.textContent = "Show";
                }
            });

        function showNotification(message) {
            var box = document.getElementById("notification");

            box.textContent = message;
            box.className = "fixed top-4 right-4 px-4 py-2 rounded shadow text-white bg-gray-700";

            setTimeout(function() {
                box.className = "hidden";
            }, 2500);
        }

        function isValidPassword(password) {
            if (password.length < 8) {
                return false;
            }

            var hasCapital = false;
            var hasSpecial = false;
            var hasNum = false;
            var special = "!@#$%^&*()";
            var nums = "0123456789";

            for (var i = 0; i < password.length; i++) {
                var char = password[i];

                if (char >= "A" && char <= "Z") {
                    hasCapital = true;
                }

                if (special.indexOf(char) !== -1) {
                    hasSpecial = true;
                }
                if (nums.indexOf(char) !== -1) {
                    hasNum = true;
                }
            
            }

            return hasCapital && hasSpecial && hasNum;
        }

        function getUsers() {
            var usersText = localStorage.getItem("users");

            if (usersText === null) {
                return [];
            }

            return JSON.parse(usersText);
        }

        signupForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (!isValidPassword(password)) {
                showNotification("password must be at least 8 characters, have 1 capital letter and 1 special character", true);
                return;
            }

            var users = getUsers();

            var alreadyExists = false;
            for (var i = 0; i < users.length; i=+i+1) {
                if (users[i].username === username) {
                    alreadyExists = true;
                }
            }

            if (alreadyExists) {
                showNotification("an account with that email already exists", true);
                return;
            }

            const hashedPassword = dcodeIO.bcrypt.hashSync(password, 10);

            users.push({
                username: username,
                password: hashedPassword
            });

            localStorage.setItem("users", JSON.stringify(users));

            showNotification("account created", false);

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
        });
    </script>

</body>
</html>
