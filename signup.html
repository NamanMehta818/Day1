<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-400 via-purple-700 to-blue-400">
 
    <div class="flex w-11/12 max-w-4xl h-[650px] bg-white rounded-2xl overflow-hidden shadow-2xl">
 
        <div class="flex-1 bg-purple-800 flex items-center justify-center p-8">
            <h1 class="text-3xl font-bold text-white">Welcome Page</h1>
        </div>
 
        <div class="flex-1 p-10">
 
            <h1 class="text-3xl font-bold mb-4">Create Account</h1>
  
            <form id="signupForm">
 
                <label for="username" class="block mb-1">Username:</label>
                <input type="text" id="username" required class="border rounded w-full p-2 mb-4">
 
                <label for="password" class="block mb-1">Password:</label>
                <input type="password" id="password" required class="border rounded w-full p-2 mb-4">
 
                <button type="submit" class="w-full bg-purple-800 text-white font-semibold rounded p-3">Create Account</button>
 
            </form>
 
            <button type="button" onclick="window.location.href='login.html'" class="border rounded w-full p-2 mt-4">
                Already have an account? Login
            </button>
        </div>
 
    </div>
 
    <script>
        const signupForm = document.getElementById("signupForm");
 
        signupForm.addEventListener("submit", function(e) {
            e.preventDefault();
 
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
 
            localStorage.setItem("username", username);
            localStorage.setItem("password", password);
 
            alert("account created");
 
            window.location.href = "login.html";
        });
    </script>
 
</body>
</html>
