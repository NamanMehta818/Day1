<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
    <script src="shared.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-400 via-purple-700 to-blue-400">

    <button id="darkModeBtn" class="fixed top-4 left-4 border rounded px-3 py-1 bg-white dark:bg-gray-800 text-lg"></button>

    <div class="flex w-11/12 max-w-4xl h-[650px] bg-white dark:bg-gray-800 text-black dark:text-white rounded-2xl overflow-hidden shadow-2xl">

        <div class="flex-1 bg-purple-800 flex items-center justify-center p-8">
            <h1 class="text-3xl font-bold text-white">Welcome Page</h1>
        </div>

        <div class="flex-1 p-10">

            <h1 class="text-3xl font-bold mb-4">Create Account</h1>

            <form id="signupForm">

                <label for="username" class="block mb-1">Email:</label>
                <input type="email" id="username" required class="border rounded w-full p-2 mb-4 text-black">

                <label for="password" class="block mb-1">Password:</label>
                <div class="relative mb-1">
                    <input type="password" id="password" required class="border rounded w-full p-2 pr-10 text-black">
                    <button type="button" id="togglePassword" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">Must be 8+ characters, have 1 capital letter and 1 special character</p>

                <button type="submit" class="w-full bg-purple-800 text-white font-semibold rounded p-3">Create Account</button>

            </form>

            <button type="button" onclick="window.location.href='login.html'" class="border rounded w-full p-2 mt-4">
                Already have an account? Login
            </button>
        </div>

    </div>

    <script>
        const signupForm = document.getElementById("signupForm");
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("togglePassword");

        var darkModeBtn = document.getElementById("darkModeBtn");

        var darkModeOn = localStorage.getItem("darkMode") === "true";

        if (darkModeOn) {
            document.documentElement.classList.add("dark");
            darkModeBtn.textContent = "☀️";
        } else {
            darkModeBtn.textContent = "🌙";
        }

        darkModeBtn.onclick = function() {
            document.documentElement.classList.toggle("dark");

            darkModeOn = document.documentElement.classList.contains("dark");
            localStorage.setItem("darkMode", darkModeOn);

            if (darkModeOn) {
                darkModeBtn.textContent = "☀️";
            } else {
                darkModeBtn.textContent = "🌙";
            }
        };

        toggleButton.addEventListener("click", function() {
                var eyeIcon = document.getElementById("eyeIcon");

                if (passwordInput.type === "password") {
                    passwordInput.type = "text";
                    eyeIcon.innerHTML = "<path d='M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-3.22 4.44M14.12 14.12A3 3 0 1 1 9.88 9.88'/><line x1='1' y1='1' x2='23' y2='23'/>";
                } else {
                    passwordInput.type = "password";
                    eyeIcon.innerHTML = "<path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/>";
                }
            });

        function isValidPassword(password) {
            if (password.length < 8) {
                return false;
            }

            var hasCapital = false;
            var hasSpecial = false;
            var hasNum = false;
            var special = "!@#$%^&*()";
            var nums = "0123456789";

            for (var i = 0; i < password.length; i++) {
                var char = password[i];

                if (char >= "A" && char <= "Z") {
                    hasCapital = true;
                }

                if (special.indexOf(char) !== -1) {
                    hasSpecial = true;
                }
                if (nums.indexOf(char) !== -1) {
                    hasNum = true;
                }
            
            }

            return hasCapital && hasSpecial && hasNum;
        }

        function getUsers() {
            var usersText = localStorage.getItem("users");

            if (usersText === null) {
                return [];
            }

            return JSON.parse(usersText);
        }

        signupForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            if (!isValidPassword(password)) {
                showNotification("password must be at least 8 characters, have 1 capital letter and 1 special character", true);
                return;
            }

            var users = getUsers();

            var alreadyExists = false;
            for (var i = 0; i < users.length; i=+i+1) {
                if (users[i].username === username) {
                    alreadyExists = true;
                }
            }

            if (alreadyExists) {
                showNotification("an account with that email already exists", true);
                return;
            }

            const hashedPassword = dcodeIO.bcrypt.hashSync(password, 10);

            users.push({
                username: username,
                password: hashedPassword
            });

            localStorage.setItem("users", JSON.stringify(users));

            showNotification("account created", false);

            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
        });
    </script>

</body>
</html>
