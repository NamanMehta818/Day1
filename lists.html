<!DOCTYPE html>
<html>
<head>
    <title>My Lists</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
    </script>
    <script src="shared.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-black dark:text-white min-h-screen p-8">

    <div id="pageHeader"></div>

    <h1 class="text-3xl font-bold mb-6">My Lists</h1>

    <div class="flex gap-2 mb-6">
        <input type="text" id="listInput" class="border rounded p-2 flex-1 text-black dark:text-white dark:bg-gray-800">
        <button id="addListBtn" class="bg-purple-800 text-white px-4 py-2 rounded">Add List</button>
    </div>

    <div class="flex gap-2 mb-4">
        <input type="text" id="searchInput" placeholder="Search lists" class="border rounded p-2 w-1/2 text-black dark:text-white dark:bg-gray-800" onkeyup="renderLists()">
    </div>

    <ul id="listOfLists"></ul>

    <div id="pageFooter"></div>

    <script>
    if (sessionStorage.getItem("loggedIn") !== "true") {
        window.location.href = "login.html";
    } else {

    loadHeaderFooter();

    var listInput = document.getElementById("listInput");
    var addListBtn = document.getElementById("addListBtn");
    var listOfLists = document.getElementById("listOfLists");

    var fileHandle = null;
    var data = null;

    function saveData() {
        writeDataToFile(fileHandle, data);
    }

    function generateId(existingIds) {
        var newId = Math.floor(Math.random() * 1000000000).toString();

        while (existingIds[newId] != null) {
            newId = Math.floor(Math.random() * 1000000000).toString();
        }

        return newId;
    }

    function renderLists() {

        var search = document.getElementById("searchInput").value.toLowerCase();

        var listHtml = Object.keys(data.lists).filter(function(listId) {
            return data.lists[listId].name.toLowerCase().includes(search);
        }).map(function(listId) {
            var currentList = data.lists[listId];
            return "<li class='bg-white dark:bg-gray-800 rounded shadow p-4 mb-2 cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700' onclick=\"goToList('" + listId + "')\">" + currentList.name + "</li>";
        }).join("");

        listOfLists.innerHTML = listHtml;
    }

    addListBtn.onclick = function() {
        var name = listInput.value;

        if (name == "") {
            return;
        }

        var newId = generateId(data.lists);

        data.lists[newId] = {
            id: newId,
            name: name,
            tasks: {}
        };

        saveData();
        listInput.value = "";
        renderLists();
    };

    listInput.addEventListener("keydown", function(e) {
        if (e.key == "Enter") {
            addListBtn.click();
        }
    });

    function goToList(listId) {
        window.location.href = "tasks.html?list=" + listId;
    }

    loadFileHandle().then(function(handle) {

        if (handle == null) {
            showNotification("please log in and pick your data file", true);
            setTimeout(function() {
                window.location.href = "login.html";
            }, 1500);
            return;
        }

        fileHandle = handle;

        return readDataFromFile(fileHandle).then(function(loadedData) {
            data = loadedData;
            if (data.lists == null) {
                data.lists = {};
            }
            renderLists();
        });

    }).catch(function(err) {
        showNotification("could not read the data file", true);
    });

    }
    </script>

</body>
</html>
